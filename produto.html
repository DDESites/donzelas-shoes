<script src="assets/js/app.js"></script>
<script>
  (function () {
    var rel = document.getElementById("relacionados");
    if (!rel) return;
    var outros = PRODUTOS.filter(function (p) { return p.id !== new URLSearchParams(location.search).get("id"); }).slice(0, 4);
    rel.innerHTML = outros.length
      ? outros.map(cardProduto).join("")
      : '<p style="color:var(--ink-soft)">Os novos modelos chegam toda semana — acompanhe no Instagram @donzelas.shoes ou chame no WhatsApp.</p>';
  })();
